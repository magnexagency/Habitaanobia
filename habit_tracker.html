<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#7b818b;--line:#e7e9ed;
  --accent:#111317;--soft:#f0f1f3;--good:#2f8f5b;--danger:#c94b4b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;padding:28px 18px 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.6px}
.brand span{color:var(--muted);font-weight:500}
.nav{display:flex;gap:8px;background:#fff;padding:5px;border:1px solid var(--line);border-radius:13px}
.nav button{border:0;background:transparent;padding:9px 15px;border-radius:9px;color:var(--muted)}
.nav button.active{background:var(--accent);color:white}
.yearbox{display:flex;align-items:center;gap:8px}
.yearbox button,.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px}
.yearbox select{height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px}
.view{display:none}.view.active{display:block}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(20,24,30,.035)}
.heroMain h1{font-size:32px;letter-spacing:-1.2px;margin:0 0 8px}
.heroMain p{color:var(--muted);margin:0 0 22px}
.progressRow{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#eceef1 0)}
.ring:after{content:"";width:88px;height:88px;background:#fff;border-radius:50%;position:absolute}
.ring strong{position:relative;z-index:1;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
.stat{background:var(--soft);padding:15px;border-radius:14px}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sectionTitle h2{font-size:17px;margin:0}.muted{color:var(--muted)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar h2{margin:0;font-size:20px}.datebar .actions{display:flex;gap:8px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:10px 14px}
.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px}
.taskForm{display:flex;gap:9px;margin-bottom:14px}
.taskForm input{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;outline:none}
.taskForm input:focus{border-color:#aaa}
.tasks{display:grid;gap:9px}
.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
.check{width:23px;height:23px;border:1.5px solid #b9bec6;border-radius:7px;background:#fff;display:grid;place-items:center;flex:none}
.task.done .check{background:var(--good);border-color:var(--good);color:#fff}
.task.done .taskName{text-decoration:line-through;color:var(--muted)}
.taskName{flex:1}.delete{border:0;background:transparent;color:#a0a5ad;font-size:19px}
.empty{padding:30px;text-align:center;border:1px dashed #d5d8dd;border-radius:15px;color:var(--muted)}
.monthGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.month{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}
.month:hover{border-color:#b9bdc4}
.monthHead{display:flex;justify-content:space-between;margin-bottom:10px}.monthHead b{font-size:14px}.monthPct{font-size:12px;color:var(--muted)}
.bar{height:6px;background:#eceef1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.dot{height:12px;border-radius:3px;background:#eceef1}.dot.done{background:#111317}.dot.partial{background:#9aa0a8}
.history{display:grid;gap:9px}
.historyRow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.historyDate{width:75px;font-size:12px;color:var(--muted)}.historyTasks{flex:1}.miniBar{height:7px;background:#eceef1;border-radius:99px;margin-top:6px;overflow:hidden}.miniBar i{display:block;height:100%;background:var(--accent)}
.settingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.setting{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.setting h3{margin:0 0 6px;font-size:15px}.setting p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.danger{color:var(--danger);border-color:#eccaca}
.modalBack{display:none;position:fixed;inset:0;background:rgba(10,12,16,.42);align-items:center;justify-content:center;padding:18px;z-index:10}
.modalBack.show{display:flex}.modal{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%}.modal h2{margin-top:0}.modal p{color:var(--muted);font-size:14px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111317;color:#fff;padding:10px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.monthGrid{grid-template-columns:repeat(2,1fr)}.settingsGrid{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.nav{order:3;width:100%;justify-content:center}.nav button{flex:1}}
@media(max-width:480px){.app{padding:18px 12px 40px}.monthGrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.progressRow{align-items:flex-start}.ring{width:100px;height:100px}.ring:after{width:74px;height:74px}.taskForm{flex-wrap:wrap}.taskForm input{min-width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Habit<span>Flow</span></div>
    <div class="nav">
      <button class="active" data-view="home">Home</button>
      <button data-view="day">Today</button>
      <button data-view="year">Year</button>
      <button data-view="history">History</button>
    </div>
    <div class="yearbox">
      <button id="prevYear">‹</button>
      <select id="yearSelect"></select>
      <button id="nextYear">›</button>
    </div>
  </div>

  <section id="home" class="view active">
    <div class="hero">
      <div class="card heroMain">
        <h1 id="welcome">Your progress</h1>
        <p id="todayText"></p>
        <div class="progressRow">
          <div class="ring" id="mainRing"><strong id="mainPct">0%</strong></div>
          <div class="stats">
            <div class="stat"><b id="consistent">0</b><span>consistent days</span></div>
            <div class="stat"><b id="completed">0</b><span>tasks completed</span></div>
            <div class="stat"><b id="totalTasks">0</b><span>tasks planned</span></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="sectionTitle"><h2>Today</h2><span class="muted" id="todayPct">0%</span></div>
        <div id="todaySummary"></div>
        <button class="primary" style="width:100%;margin-top:14px" onclick="showView('day')">Open today's tasks</button>
      </div>
    </div>
    <div class="sectionTitle"><h2>Year overview</h2><span class="muted" id="overviewYear"></span></div>
    <div class="monthGrid" id="monthGrid"></div>
  </section>

  <section id="day" class="view">
    <div class="card">
      <div class="datebar">
        <div><h2 id="selectedDateTitle"></h2><span class="muted" id="selectedDateSub"></span></div>
        <div class="actions"><button class="secondary" id="prevDay">‹</button><button class="secondary" id="nextDay">›</button><button class="secondary" id="jumpToday">Today</button></div>
      </div>
      <div class="taskForm">
        <input id="taskInput" placeholder="Add a task for this date..." maxlength="120">
        <button class="primary" id="addTask">Add task</button>
      </div>
      <div class="tasks" id="tasks"></div>
    </div>
  </section>

  <section id="year" class="view">
    <div class="card">
      <div class="sectionTitle"><h2 id="yearTitle">Year</h2><span class="muted">12-month record</span></div>
      <div class="monthGrid" id="yearGrid"></div>
    </div>
  </section>

  <section id="history" class="view">
    <div class="card">
      <div class="sectionTitle"><h2>Daily record</h2><span class="muted">Only dates with tasks</span></div>
      <div class="history" id="historyList"></div>
    </div>
  </section>
</div>

<div class="modalBack" id="modalBack">
  <div class="modal">
    <h2>Reset all data?</h2>
    <p>This permanently removes every task and completion record stored in this browser.</p>
    <div class="modalActions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="resetAll()">Reset</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="habitflow_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');
let selectedDate=new Date();
let selectedYear=selectedDate.getFullYear();
const todayKey=()=>fmt(new Date());
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(k){let [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function dayData(k){return db.days[k]||(db.days[k]={tasks:[]})}
function dateLabel(k,opts={weekday:'long',month:'long',day:'numeric',year:'numeric'}){return parse(k).toLocaleDateString(undefined,opts)}
function pct(done,total){return total?Math.round(done/total*100):0}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function renderYears(){
  const s=document.getElementById("yearSelect"); s.innerHTML="";
  const current=new Date().getFullYear();
  for(let y=current-10;y<=current+15;y++){let o=document.createElement("option");o.value=y;o.textContent=y;if(y===selectedYear)o.selected=true;s.appendChild(o)}
}
function yearStats(y){
  let total=0,done=0,days=0,consistent=0;
  for(let m=0;m<12;m++){
    let max=new Date(y,m+1,0).getDate();
    for(let d=1;d<=max;d++){
      let k=`${y}-${pad(m+1)}-${pad(d)}`, x=db.days[k];
      if(x&&x.tasks&&x.tasks.length){days++;total+=x.tasks.length;done+=x.tasks.filter(t=>t.done).length;if(x.tasks.every(t=>t.done))consistent++}
    }
  }
  return {total,done,days,consistent,p:pct(done,total)}
}
function monthStats(y,m){
  let total=0,done=0, active=0,days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){let k=`${y}-${pad(m+1)}-${pad(d)}`,x=db.days[k];if(x&&x.tasks.length){active++;total+=x.tasks.length;done+=x.tasks.filter(t=>t.done).length}}
  return {total,done,active,p:pct(done,total),days}
}
function monthCard(y,m){
  let s=monthStats(y,m), name=new Date(y,m,1).toLocaleString(undefined,{month:"long"});
  let dots="";
  for(let d=1;d<=s.days;d++){let k=`${y}-${pad(m+1)}-${pad(d)}`,x=db.days[k],v=x&&x.tasks.length?pct(x.tasks.filter(t=>t.done).length,x.tasks.length):0;dots+=`<i class="dot ${v===100?'done':v>0?'partial':''}" title="${d}: ${v}%"></i>`}
  return `<div class="month" onclick="openMonth(${y},${m})"><div class="monthHead"><b>${name}</b><span class="monthPct">${s.p}%</span></div><div class="bar"><i style="width:${s.p}%"></i></div><div class="week">${dots}</div></div>`
}
function renderHome(){
  let s=yearStats(selectedYear), k=todayKey(), x=db.days[k]||{tasks:[]}, tp=pct(x.tasks.filter(t=>t.done).length,x.tasks.length);
  document.getElementById("welcome").textContent=`${selectedYear} progress`;
  document.getElementById("todayText").textContent=dateLabel(k)+". Keep showing up.";
  document.getElementById("mainRing").style.setProperty("--p",s.p);
  document.getElementById("mainPct").textContent=s.p+"%";
  document.getElementById("consistent").textContent=s.consistent;
  document.getElementById("completed").textContent=s.done;
  document.getElementById("totalTasks").textContent=s.total;
  document.getElementById("todayPct").textContent=tp+"%";
  document.getElementById("todaySummary").innerHTML=x.tasks.length?`${x.tasks.filter(t=>t.done).length} of ${x.tasks.length} tasks completed`:`No tasks added yet.`;
  document.getElementById("overviewYear").textContent=selectedYear;
  document.getElementById("monthGrid").innerHTML=Array.from({length:12},(_,m)=>monthCard(selectedYear,m)).join("");
}
function renderDay(){
  let k=fmt(selectedDate),x=dayData(k);
  document.getElementById("selectedDateTitle").textContent=dateLabel(k);
  document.getElementById("selectedDateSub").textContent=`${x.tasks.filter(t=>t.done).length} of ${x.tasks.length} completed`;
  let el=document.getElementById("tasks");
  if(!x.tasks.length){el.innerHTML=`<div class="empty">No tasks for this day.<br><small>Add your tasks above. Tasks are saved separately for every date.</small></div>`;return}
  el.innerHTML=x.tasks.map((t,i)=>`<div class="task ${t.done?'done':''}">
    <button class="check" onclick="toggleTask('${k}',${i})">${t.done?'✓':''}</button>
    <div class="taskName">${escapeHTML(t.name)}</div>
    <button class="delete" onclick="deleteTask('${k}',${i})">×</button>
  </div>`).join("");
}
function renderYear(){
  document.getElementById("yearTitle").textContent=`${selectedYear} year`;
  document.getElementById("yearGrid").innerHTML=Array.from({length:12},(_,m)=>monthCard(selectedYear,m)).join("");
}
function renderHistory(){
  let keys=Object.keys(db.days).filter(k=>db.days[k].tasks?.length).sort().reverse();
  document.getElementById("historyList").innerHTML=keys.length?keys.map(k=>{
    let x=db.days[k],p=pct(x.tasks.filter(t=>t.done).length,x.tasks.length);
    return `<div class="historyRow"><div class="historyDate">${parse(k).toLocaleDateString(undefined,{month:"short",day:"numeric"})}<br>${parse(k).getFullYear()}</div><div class="historyTasks"><b>${x.tasks.filter(t=>t.done).length}/${x.tasks.length} completed</b><div class="miniBar"><i style="width:${p}%"></i></div></div><span class="muted">${p}%</span></div>`
  }).join(""):`<div class="empty">Your daily history will appear here.</div>`;
}
function renderAll(){renderYears();renderHome();renderDay();renderYear();renderHistory()}
function showView(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v))}
function addTask(){let input=document.getElementById("taskInput"),name=input.value.trim();if(!name)return;let k=fmt(selectedDate);dayData(k).tasks.push({name,done:false,id:Date.now()});input.value="";save();toast("Task added")}
function toggleTask(k,i){db.days[k].tasks[i].done=!db.days[k].tasks[i].done;save()}
function deleteTask(k,i){db.days[k].tasks.splice(i,1);if(!db.days[k].tasks.length)delete db.days[k];save();toast("Task removed")}
function changeYear(n){selectedYear+=n;selectedDate=new Date(selectedYear,selectedDate.getMonth(),Math.min(selectedDate.getDate(),new Date(selectedYear,selectedDate.getMonth()+1,0).getDate()));renderAll()}
function openMonth(y,m){selectedYear=y;selectedDate=new Date(y,m,1);showView("day");renderAll()}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
function resetAll(){db={days:{}};localStorage.removeItem(KEY);closeModal();renderAll();toast("All data reset")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.getElementById("yearSelect").onchange=e=>{selectedYear=+e.target.value;renderAll()}
document.getElementById("prevYear").onclick=()=>changeYear(-1);
document.getElementById("nextYear").onclick=()=>changeYear(1);
document.getElementById("addTask").onclick=addTask;
document.getElementById("taskInput").onkeydown=e=>{if(e.key==="Enter")addTask()};
document.getElementById("prevDay").onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);selectedYear=selectedDate.getFullYear();renderAll()}
document.getElementById("nextDay").onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);selectedYear=selectedDate.getFullYear();renderAll()}
document.getElementById("jumpToday").onclick=()=>{selectedDate=new Date();selectedYear=selectedDate.getFullYear();renderAll()}
renderAll();
</script>
</body>
</html>
